# Deploy the tracked dist/ bundle to GitHub Pages on every push to master.
# Pages serves the repo site from /<repo>/ — the build uses a relative base
# ('./') so the same bundle works at the repo root, in the preview server,
# and on Pages with no rebuild step. The /api AI proxy is not available on
# Pages (static hosting); the app plays in its offline soul-aware voice there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — dist/ must be tracked and fresh
        id: check
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing — run 'npm run build:commit' and push again."; exit 1
          fi
          # The tracked bundle must not be older than the newest source commit.
          last_src=$(git log -1 --format=%ct -- index.html src public vite.config.js)
          last_dist=$(git log -1 --format=%ct -- dist)
          if [ "$last_src" -gt "$last_dist" ]; then
            echo "::error::dist/ is stale (source changed after the last bundle commit) — run 'npm run build:commit' and push again."; exit 1
          fi
          echo "Bundle present and fresh (dist $(git log -1 --format=%h -- dist))."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
