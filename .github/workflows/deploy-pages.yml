# Deploy the tracked dist/ bundle to GitHub Pages. Triggered only after a
# green CI run (test + build), so a failing suite blocks the deploy instead
# of shipping regressions. Pages serves the repo site from /<repo>/ — the
# build uses a relative base ('./') so the same bundle works at the repo
# root, in the preview server, and on Pages with no rebuild step. The /api
# AI proxy is not available on Pages (static hosting); the app plays in its
# offline soul-aware voice there.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The guard below compares `git log` timestamps of the source paths
          # against dist/; a default 1-commit checkout makes that vacuous, so
          # this job would happily deploy a stale bundle. Fetch full history.
          fetch-depth: 0

      - name: Guard — dist/ must be tracked and fresh
        id: check
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing — run 'npm run build:commit' and push again."; exit 1
          fi
          # The tracked bundle must not be older than the newest source commit.
          last_src=$(git log -1 --format=%ct -- index.html src public vite.config.js)
          last_dist=$(git log -1 --format=%ct -- dist)
          if [ "$last_src" -gt "$last_dist" ]; then
            echo "::error::dist/ is stale (source changed after the last bundle commit) — run 'npm run build:commit' and push again."; exit 1
          fi
          echo "Bundle present and fresh (dist $(git log -1 --format=%h -- dist))."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Every deploy gets verified by its consumer: the job points the
  # deployed-site check suite at the fresh page_url, which fetches the live
  # bytes, proves the server serves the SAME bundle this commit tracks
  # (content-hash filename equality — a stale CDN deployment fails here,
  # not in front of a user), then boots those deployed bytes through the
  # real shell harness in jsdom — dock, windows, tick loop, zero console
  # errors. The suite is skipped (not failed) if Pages does not answer:
  # the deploy job above already reported the authoritative state.
  verify-deploy:
    name: Verify deployed site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Boot the production bundle from the live URL
        env:
          BRO_DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx vitest run tests/deployed-site.check.test.js
