# Release: create a GitHub Release with auto-generated notes whenever a
# version tag (v*) is pushed.  CI must pass first — this workflow
# therefore waits for the CI workflow on the same commit to succeed
# before drafting the release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write          # needed to create the release

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: Test & Build
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true   # GitHub's auto-generated notes
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # v3.2.0-beta.1 → prerelease
