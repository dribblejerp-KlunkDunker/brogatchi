# CI: run the vitest suite and build on every push so regressions are
# caught before they can ship. The GitHub Pages deploy (.github/workflows/
# deploy-pages.yml) is triggered by this workflow's success instead of by
# pushes directly — a red build can no longer reach the live site.
name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The dist-freshness guard below compares `git log` timestamps of the
          # source paths against dist/. A default 1-commit checkout makes that
          # comparison vacuous (both sides resolve to HEAD, or to nothing), so
          # a source change committed without a rebuilt bundle would sail
          # through. Fetch the full history so staleness is actually visible.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest suite (app + bridge)
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/vitest.log

      # The README's tests badge reads badges/tests.json (shields endpoint).
      # Prove it tells the truth: parse the real vitest count from this run's
      # log and fail CI when the tracked badge is behind the suite.
      - name: Verify tests badge matches the suite
        run: |
          # vitest colours its summary, so strip ANSI codes before parsing.
          TESTS=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/vitest.log | grep -oE 'Tests  [0-9]+ passed' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$TESTS" ]; then echo "::error::could not parse test count from vitest output"; exit 1; fi
          TRACKED=$(node -p "require('./badges/tests.json').message.replace(/\\D/g,'')")
          echo "suite: $TESTS — badge: $TRACKED"
          if [ "$TESTS" != "$TRACKED" ]; then
            echo "::error::badges/tests.json says $TRACKED but the suite is $TESTS — update the badge in the same commit."
            exit 1
          fi

      - name: Build (includes bridge-memory-log postbuild hook)
        run: npm run build

      # Deploy-pages expects the tracked dist/ to be fresh; on CI we have a
      # freshly built dist/ in the workspace, so prove the freshness guard
      # would pass before declaring success.
      - name: Verify dist/ is present and fresh
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/bridge-memory-log.json || { echo "::error::bridge-memory-log snapshot missing from dist/"; exit 1; }
          last_src=$(git log -1 --format=%ct -- index.html src public vite.config.js)
          last_dist=$(git log -1 --format=%ct -- dist)
          if [ "$last_src" -gt "$last_dist" ]; then
            echo "::error::tracked dist/ is stale (source newer than bundle) — run 'npm run build' and commit the result."
            exit 1
          fi
          echo "dist/ present, fresh (bundle $(git log -1 --format=%h -- dist)), snapshot shipped."
